# Hand-maintained facts about the Berlin Marathon course.
# Rule: every fact about the world has a `source` URL and the date we `accessed` it.
# Positions along the course are km from the start.

id: berlin
# Plain event name; no sponsor styling or trade dress (PLAN.md §9).
name: Berlin Marathon
city: Berlin
timezone: Europe/Berlin
source: https://www.bmw-berlin-marathon.com/en/your-race/course/
accessed: 2026-09-16

certified_distance:
  meters: 42195
  source: https://www.bmw-berlin-marathon.com/en/your-race/course/
  accessed: 2026-09-16

# The organizer's own course file. The pipeline downloads it into the local cache;
# the file itself is never committed.
route:
  url: https://www.bmw-berlin-marathon.com/fileadmin/media/events/berlinmarathon/gpx/BM25_Marathon-Strecke.gpx
  edition: 2025
  source: https://www.bmw-berlin-marathon.com/en/your-race/course/
  accessed: 2026-09-16
  note: No 2026 course file was published as of the accessed date; the 2025 file is used.

# First point of the official course file (Straße des 17. Juni).
start:
  lat: 52.515214
  lon: 13.3602
  source: https://www.bmw-berlin-marathon.com/fileadmin/media/events/berlinmarathon/gpx/BM25_Marathon-Strecke.gpx
  accessed: 2026-09-16

# All km here are on ONE scale: distance measured along the official 2025 course file, the same
# scale as the course line in the bundle. The file measures 42.28 km; the certified course is
# 42.195 km because it is measured on the shortest legal line.
# Places: km = distance along the course file to the point closest to the landmark, rounded to
# 0.1 km; `source` locates the landmark. Half marathon and Finish: the certified positions
# (21.0975 km, 42.195 km) scaled onto the course file (x 42.28 / 42.195).
landmarks:
  - name: Victory Column (Großer Stern)
    km: 0.7
    source: https://en.wikipedia.org/wiki/Victory_Column_(Berlin)
    accessed: 2026-09-16
  - name: Strausberger Platz
