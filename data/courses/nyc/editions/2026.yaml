    label: "Mile 3"
    serves: [water, sports-drink, medical]
    detail: >-
      The sports drink is Gatorade Endurance Formula, lemon-lime.
    source: https://www.nyrr.org/tcsnycmarathon/race-day/the-course
    carried_over: true
    accessed: 2026-09-21
