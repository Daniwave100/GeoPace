# Hand-maintained facts about the 2026 edition of the New York City Marathon: its date and its waves.
# Rule: every fact about the world has a `source` URL and the date we `accessed` it.
#
# Wave times are wall-clock times in the course's time zone (America/New_York, from course.yaml).
# ALWAYS put them in quotes ("09:10"): YAML reads an unquoted 10:20 as the number 620.
#
# Only the five runner waves are listed. The professional and wheelchair starts (08:00 to 09:05
# in 2025) are in the same guide, but the app plans a runner's race.
#
# Owner's decision, 2026-09-18 (PLAN.md D40): we don't chase wave start times. Each runner types
# their own, from what NYRR sends them, and that always wins. The times below are only what the
# start-time box shows until they do, and they are flagged as carried over.
# On 2026-09-18 every page on nyrr.org sat behind NYRR's waiting room, which a browser passes and
# our tools don't (and we don't work around it). If someone reads the 2026 date and wave times
# there, update this file: new `source`/`accessed`, `confirmed: true` on the date, and drop
# `carried_over` from whatever is confirmed.

edition: 2026

# NYRR's own 2025 runner guide says the race is held every year on the first Sunday in November;
# Abbott World Marathon Majors says the same (https://www.worldmarathonmajors.com/races/new-york-city).
# In 2026 that Sunday is 1 November, which is also the morning US clocks go back an hour.
date:
  day: 2026-11-01
  # Not confirmed: nothing we could open states the 2026 date itself. The app says so next to it.
  confirmed: false
  source: https://webassets.nyrr.org/nyrrwebsiteassets/TCSNYCM25_RunnerGuide_Mobile_M.pdf
  accessed: 2026-09-18
  note: From the organizer's rule that the race is on the first Sunday in November. NYRR's 2026 pages could not be opened to confirm it.

carried_over:
  from_edition: 2025
  reason: NYRR's 2026 wave times could not be confirmed, so these are the 2025 edition's. When NYRR sends you your start time, type it in as your own.

# The 2025 start schedule, from NYRR's 2025 runner guide.
waves:
  - id: wave-1
    name: Wave 1
    start_local: "09:10"
    carried_over: true
    source: https://webassets.nyrr.org/nyrrwebsiteassets/TCSNYCM25_RunnerGuide_Mobile_M.pdf
    accessed: 2026-09-18
  - id: wave-2
    name: Wave 2
    start_local: "09:45"
    carried_over: true
    source: https://webassets.nyrr.org/nyrrwebsiteassets/TCSNYCM25_RunnerGuide_Mobile_M.pdf
    accessed: 2026-09-18
  - id: wave-3
    name: Wave 3
    start_local: "10:20"
    carried_over: true
    source: https://webassets.nyrr.org/nyrrwebsiteassets/TCSNYCM25_RunnerGuide_Mobile_M.pdf
    accessed: 2026-09-18
  - id: wave-4
    name: Wave 4
    start_local: "10:55"
    carried_over: true
    source: https://webassets.nyrr.org/nyrrwebsiteassets/TCSNYCM25_RunnerGuide_Mobile_M.pdf
    accessed: 2026-09-18
  - id: wave-5
    name: Wave 5
    start_local: "11:30"
    carried_over: true
    source: https://webassets.nyrr.org/nyrrwebsiteassets/TCSNYCM25_RunnerGuide_Mobile_M.pdf
    accessed: 2026-09-18

# Aid stations: none listed, on purpose (#12).
#
# NYRR publishes what the course serves on its own "The Course" page, and that page sits behind a
# waiting room that a person's browser passes and our tools don't — the same wall the wave times
# ran into (PLAN.md §10, D38). We don't work around it. The runner guide and the official course
# map, both of which we can fetch from webassets.nyrr.org, carry no station list: the guide is
# bibs, bags and the finish, and the map marks miles and neighbourhoods.
#
# Third-party pages print the list. None of them is the organizer, so none of them goes in here.
#
# What it takes to fill this in: open https://www.nyrr.org/tcsnycmarathon/race-day/the-course in a
# browser, and copy what it says about fluid stations, gel depots, refill stations and anything
# else handed out, with the miles. Then write them here the way Berlin's are written, in km
# (a mile is 1.609344 km), with that URL as the source and the day you looked as `accessed`. If
# they turn out to be last year's, mark each `carried_over: true` and add the edition's
# `carried_over` block saying so — the app flags every carried-over fact to the runner.
#
# Until then the app has no Aid layer for New York, which is the honest state: only layers that
# exist get a switch (PLAN.md D47).
