    accessed: 2026-09-18

# The organizer's fluid stations, from NYRR's own race-day course page, in their words:
#   Purified water: official fluid stations every mile from mile 3 to mile 25, except miles 5, 7 and 9
#   Gatorade Endurance Formula, lemon-lime: the same stations
#   Maurten Gels at Gel Depots: miles 12 and 18
#   Bananas: mile 21
# and one instruction that isn't a thing served: fluids come in compostable cups, from tables on
# both sides of the course, and the page asks runners to take a cup from a later table and keep
# moving rather than crowd the first one.
#
# Not listed, because this page doesn't say it: the self-serve water refill stations a press
# release put at miles 8, 14, 17, 20 and 23. No `refill` on any station here, and no
# `own-bottle` either — NYRR takes no personal refreshments for the course.
#
# km_marked is the organizer's own position, in km on the certified 42.195 km course: a mile is
# 1.609344 km. The pipeline puts each one on the course line, which is 42.688 km.
#
# Read off NYRR's own page on 2026-09-21, and it was still the 2025 edition's list — so every
# station here is `carried_over: true` and the app flags each of them to the runner. nyrr.org sits
# behind a waiting room our tools don't pass (PLAN.md §10), so a person opened it for us.
#
# Medical: the same page says medical aid stations are approximately every mile from mile 3 and at
# the finish, and that volunteers and supplies are at *all* aid stations — so every station here
# has it. "Approximately every mile" is not a list of positions, so no medical station of its own
# is invented; what is claimed is only what the page states about these.
aid_stations:
