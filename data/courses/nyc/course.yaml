# of the Verrazzano) described as turn points, and the pipeline traces it along OpenStreetMap
# streets. Which streets, in which order, comes from the City of New York's 2025 list of closed
# course streets (each segment "street, from - to") and NYRR's 2025 street closures and course
# map. Each waypoint's lat/lon is the OpenStreetMap intersection (or point on the named way) it
# describes. `way` pins a waypoint to one OpenStreetMap way where roadways are stacked or
# side by side: the Verrazzano's upper deck, the Queensboro's lower level.
