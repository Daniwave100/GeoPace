# NYRR publishes no coordinates for the start line. This position is derived from the course's
# USATF certification (NY22001JHP, measured 2022, valid to 2032), which records the straight-line
# separation between start and finish as 47.22% of 42.195 km = 19,924 m: it is the point on the
# bridge's upper Brooklyn-bound roadway exactly that far from the finish line by Tavern on the
# Green. Moving 1 m along the bridge changes the separation by 0.68 m, so the certificate's
# rounding puts this within ~3 m; the remaining uncertainty is the finish line's own position.
start:
  lat: 40.603044
  lon: -74.055468
  source: https://certifiedroadraces.com/certificate/?type=l&id=NY22001JHP
  accessed: 2026-09-17

# All km here are on ONE scale: distance measured along the traced course line in the bundle.
# The line measures 42.69 km; the certified course is 42.195 km because it is measured along the
# shortest legal line (and this line follows street centres). Each landmark's km is the point on
# the course line closest to the coordinate its `source` gives, rounded to 0.1 km. Half marathon
# and Finish: the certified positions (21.0975 km, 42.195 km) scaled onto the course line
# (x 42.688 / 42.195).
