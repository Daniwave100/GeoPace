# Hand-maintained facts about the New York City Marathon course.
# Rule: every fact about the world has a `source` URL and the date we `accessed` it.
# Positions along the course are km from the start.

id: nyc
# Plain event name; no sponsor styling or trade dress (PLAN.md §9).
name: New York City Marathon
city: New York City
timezone: America/New_York
source: https://www.nyrr.org/tcsnycmarathon/race-day/the-course
accessed: 2026-09-17

certified_distance:
  meters: 42195
  source: https://www.nyrr.org/tcsnycmarathon/race-day/the-course
  accessed: 2026-09-17

# The organizer publishes no course file anyone can download (the course map is a PDF; the
