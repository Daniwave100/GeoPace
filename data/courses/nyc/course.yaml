# Stretches where the course runs on a bridge deck or an elevated roadway. NYC's bare-earth DEM
# has all of them removed, so on a bridge it reports the water or the ground underneath (the
# Narrows read as sea level). The pipeline replaces these stretches with the deck's own measured
# height, from the 2017 LiDAR returns classified as bridge deck.
# `deck` says which roadway the runners are on where two are stacked: the Verrazzano's upper
# level (Blue start), the Queensboro's lower level.
# km ranges = where the traced course line overlaps the bridge's OpenStreetMap way.
bridges:
  - name: Verrazzano-Narrows Bridge (upper level)
    km_start: 0.00
    km_end: 1.94
    deck: upper
    source: https://www.openstreetmap.org/way/46858873
    accessed: 2026-09-17
    note: >-
      The 2017 LiDAR has no returns at all over the middle of the main span (about km 0.85-1.45),
      so the height there is a straight line between the last measured deck heights on either
      side. The real deck crests a few meters higher.
  - name: Gowanus Expressway viaduct (Brooklyn approach) and the ramp to 92nd Street
    km_start: 1.94
    km_end: 2.77
    source: https://www.openstreetmap.org/way/38180795
    accessed: 2026-09-17
  - name: 92nd Street bridge at the Belt Parkway interchange
    km_start: 2.96
    km_end: 3.09
    source: https://www.openstreetmap.org/way/420540321
    accessed: 2026-09-17
  - name: 4th Avenue bridge over the Gowanus Expressway
    km_start: 5.66
    km_end: 5.83
    source: https://www.openstreetmap.org/way/46640100
    accessed: 2026-09-17
  - name: Pulaski Bridge
    km_start: 20.57
    km_end: 21.27
    source: https://www.openstreetmap.org/way/46717584
    accessed: 2026-09-17
  - name: Ed Koch Queensboro Bridge (lower level) and the ramp down to First Avenue
    km_start: 23.79
    km_end: 26.21
    deck: lower
    source: https://www.openstreetmap.org/way/198924625
    accessed: 2026-09-17
    note: >-
      The span runs past the bridge itself to where the exit ramp reaches street level near
      First Avenue. The LiDAR classifies only the bridge proper as deck, so the last stretch of
      ramp is a straight line down to the street; ending the span at the bridge instead would
      drop the course 10 m onto the ground under the ramp.
  - name: Willis Avenue Bridge
    km_start: 31.24
    km_end: 32.17
    source: https://www.openstreetmap.org/way/32965216
    accessed: 2026-09-17
  - name: Madison Avenue Bridge
    km_start: 33.79
    km_end: 34.12
    source: https://www.openstreetmap.org/way/46625537
    accessed: 2026-09-17
  - name: East Drive bridge over the 79th Street Transverse, Central Park
    km_start: 39.85
    km_end: 39.93
    source: https://www.openstreetmap.org/way/959011551
    accessed: 2026-09-17
